<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hypsis — Proposition de valeur pour les fonds de Private Equity</title>
<meta name="description" content="Hypsis permet à vos Operating Partners de convertir leurs initiatives en impact EBITDA.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Italiana&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f8f6f1;
    --ink: #1a1a2e;
    --ink-muted: #7a7a8c;
    --bronze: #7a6840;
    --bronze-dark: #5c4e30;
    --stone-light: #e8e4db;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--paper);
    color: var(--ink);
    font-family: 'Outfit', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.2rem 2rem;
    border-bottom: 1px solid var(--stone-light);
    flex-wrap: wrap;
  }

  .wordmark {
    font-family: 'Italiana', serif;
    font-size: 0.8rem;
    letter-spacing: 0.5em;
    color: var(--bronze);
    text-transform: uppercase;
  }

  .wordmark a { color: inherit; text-decoration: none; }
  .wordmark a:hover { color: var(--ink); }

  .download {
    font-size: 0.72rem;
    font-weight: 500;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--paper);
    background: var(--bronze);
    padding: 0.7rem 1.6rem;
    border-radius: 2px;
    text-decoration: none;
    transition: all 0.2s;
  }

  .download:hover {
    background: var(--bronze-dark);
    transform: translateY(-1px);
    box-shadow: 0 4px 12px rgba(92, 78, 48, 0.15);
  }

  .viewer {
    flex: 1;
    width: 100%;
    border: none;
    min-height: 80vh;
  }

  footer {
    padding: 0.9rem 2rem;
    border-top: 1px solid var(--stone-light);
    font-size: 0.78rem;
    color: var(--ink-muted);
    text-align: center;
  }

  footer a { color: var(--bronze); text-decoration: none; }
  footer a:hover { color: var(--ink); }
</style>
</head>
<body>

<header>
  <div class="wordmark"><a href="https://hypsis.ai">Hypsis</a></div>
  <a class="download" href="value-proposition-pe.pdf" download>Télécharger le PDF</a>
</header>

<iframe class="viewer" src="value-proposition-pe.pdf#view=FitH" title="Hypsis — Proposition de valeur pour les fonds de Private Equity"></iframe>

<footer>
  <a href="mailto:hi@hypsis.ai">hi@hypsis.ai</a>
</footer>

</body>
</html>
